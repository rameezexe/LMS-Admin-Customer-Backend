server.port=8084
spring.application.name=borrowing-service

# ── Database (H2) ──
spring.datasource.url=jdbc:h2:file:./data/borrowingDB;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ──
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RBdXRoMjU2Qml0cw==
app.jwt.expiration=86400000

# ── Swagger ──
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Eureka ──
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
