# ===================================================================
# Auth Service Configuration
# ===================================================================
spring.application.name=auth-service
server.port=8081

# ===================================================================
# H2 Embedded Database
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/authDB;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Eureka Client
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===================================================================
# JWT Configuration
# ===================================================================
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RBdXRoMjU2Qml0cw==
app.jwt.expiration=86400000

# ===================================================================
# Admin Registration Secret
# ===================================================================
app.admin.secret=SUPER_SECRET_ADMIN_KEY_2024

# ===================================================================
# Actuator & Swagger
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
