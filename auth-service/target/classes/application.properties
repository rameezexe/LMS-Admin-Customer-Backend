# ===================================================================
# Auth Service Configuration
# ===================================================================
spring.application.name=auth-service
server.port=8081

# ===================================================================
# Derby Embedded Database
# ===================================================================
spring.datasource.url=jdbc:derby:./data/authDB;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.username=
spring.datasource.password=
# Hibernate 6 auto-detects Derby dialect from JDBC driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ===================================================================
# Eureka Client
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===================================================================
# JWT Configuration
# ===================================================================
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RBdXRoMjU2Qml0cw==
app.jwt.expiration=86400000

# ===================================================================
# Admin Registration Secret
# ===================================================================
app.admin.secret=SUPER_SECRET_ADMIN_KEY_2024

# ===================================================================
# Actuator & Swagger
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
