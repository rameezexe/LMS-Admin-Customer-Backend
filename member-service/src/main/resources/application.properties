server.port=8083
spring.application.name=member-service

# ── Database (Derby) ──
spring.datasource.url=jdbc:derby:./data/memberDB;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.jpa.database-platform=org.hibernate.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── JWT ──
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RBdXRoMjU2Qml0cw==
app.jwt.expiration=86400000

# ── Swagger ──
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Eureka ──
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ── AWS S3 ──
aws.s3.bucket-name=lms-tcs
aws.s3.region=eu-north-1
aws.s3.access-key=YOUR_AWS_ACCESS_KEY
aws.s3.secret-key=YOUR_AWS_SECRET_KEY
aws.s3.base-url=https://${aws.s3.bucket-name}.s3.${aws.s3.region}.amazonaws.com

# ── Multipart Upload ──
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
