# ===================================================================
# API Gateway Configuration
# ===================================================================
spring.application.name=api-gateway
server.port=8080

# ===================================================================
# Eureka Client
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===================================================================
# JWT Configuration (shared secret across all services)
# ===================================================================
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RBdXRoMjU2Qml0cw==
app.jwt.expiration=86400000

# ===================================================================
# Gateway Routes
# ===================================================================

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/auth/**

# Catalog Service
spring.cloud.gateway.routes[1].id=catalog-service
spring.cloud.gateway.routes[1].uri=lb://catalog-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/admin/books/**,/api/admin/librarians/**,/api/user/books/**

# Member Service
spring.cloud.gateway.routes[2].id=member-service
spring.cloud.gateway.routes[2].uri=lb://member-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin/members/**,/api/user/profile/**

# Borrowing Service
spring.cloud.gateway.routes[3].id=borrowing-service
spring.cloud.gateway.routes[3].uri=lb://borrowing-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admin/borrows/**,/api/user/borrows/**

# Payment Service
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/payments/**,/api/user/payments/**

# Notification & Report Service
spring.cloud.gateway.routes[5].id=notification-report-service
spring.cloud.gateway.routes[5].uri=lb://notification-report-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/admin/reports/**,/api/user/notifications/**

# ===================================================================
# Gateway Global Settings
# ===================================================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ===================================================================
# Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
